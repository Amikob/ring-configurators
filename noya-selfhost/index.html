<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Noya (self-hosted pilot) | Next Diamonds</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./style.css?v=sh6">
  <style>
    #viewer canvas { display:block; touch-action:none; }
    .pilot-badge { position:absolute; left:28px; top:44px; font-size:11px; color:#7b7b7b; z-index:2; }
    /* Docked in the side panel (desktop) / in place of the options (phone), so it never covers the ring. */
    .env-panel { background:#fff; border:1px solid #d9dedb; border-radius:10px; padding:10px; display:flex; flex-direction:column; gap:7px; }
    .env-head { display:flex; justify-content:space-between; align-items:center; font-size:13px; font-weight:600; }
    .env-close { width:30px; height:30px; border:1px solid #c9d1cd; border-radius:6px; background:#f4f6f5; font-size:18px; line-height:1; cursor:pointer; }
    .env-panel[hidden] { display:none; }
    .env-row { display:flex; align-items:center; gap:6px; }
    .env-kind { width:60px; font-size:13px; font-weight:600; }
    .env-row select { flex:1; min-width:0; height:36px; font-size:14px; border:1px solid #c9d1cd; border-radius:6px; background:#fff; padding:0 6px; }
    .env-step { width:36px; height:36px; border:1px solid #c9d1cd; border-radius:6px; background:#f4f6f5; font-size:20px; line-height:1; cursor:pointer; }
    .env-row select:disabled + .env-step, .env-step:disabled { opacity:.4; }
    .look-slider { display:flex; align-items:center; gap:6px; font-size:13px; }
    .look-slider input { flex:1; min-width:0; }
    .look-slider output { width:38px; text-align:right; font-size:12px; color:#555; font-variant-numeric:tabular-nums; }
    .advanced summary { cursor:pointer; font-size:13px; font-weight:600; padding:4px 0; }
    .advanced[open] { display:flex; flex-direction:column; gap:5px; }
    .look-reset { align-self:flex-end; font-size:12px; border:1px solid #c9d1cd; border-radius:6px; background:#f4f6f5; padding:4px 10px; cursor:pointer; }
    .env-status { font-size:11px; color:#7b7b7b; min-height:14px; }
    .env-current { font-size:12px; color:#244c3e; font-weight:600; }
    @media (max-width: 850px) {
      .panel.look-open > fieldset, .panel.look-open > .metal-fields { display:none; }
      .env-panel { padding:8px; gap:5px; border-radius:8px; max-height:46dvh; overflow-y:auto; }
      .env-row select, .env-step { height:32px; } .env-step { width:32px; }
      .env-head .env-close { width:28px; height:28px; }
    }
    @media (max-width: 1000px) and (orientation: landscape) and (max-height: 550px) { .panel.look-open > fieldset, .panel.look-open > .metal-fields { display:none; } }
    #tuning { display:none; gap:6px; flex-direction:column; font-size:12px; padding-top:14px; border-top:1px solid var(--line); }
    #tuning.on { display:flex; } #tuning label { display:flex; justify-content:space-between; gap:8px; align-items:center; } #tuning input[type=range]{ width:55%; }
  </style>
  <script type="importmap">
  { "imports": {
      "three": "./vendor/three/three.module.js",
      "three/addons/": "./vendor/three/addons/",
      "three-mesh-bvh": "./vendor/three-mesh-bvh.module.js"
  } }
  </script>
</head>
<body>
  <div class="app">
    <main class="stage" aria-label="Noya 3D ring">
      <div class="stage-brand"><img src="./assets/wordmark-1row-black.png" alt="Next Diamonds" width="1800" height="220"><span>Noya</span></div>
      <div id="viewer" aria-label="Interactive 3D viewer"></div>
      <div id="startup" class="startup" role="status"><img class="loading-monogram" src="./assets/monogram-champagne.png" alt="Next Diamonds" width="960" height="960"><span class="spinner"></span><span id="startup-text">Opening Noya...</span></div>
      <div class="pilot-badge">Self-hosted pilot (own engine, own storage)</div>
      <div class="viewer-footer">
        <div class="stage-caption"><span id="selection-summary">Noya</span><span id="update-status" role="status" aria-live="polite"></span></div>
        <div class="viewer-tools" role="group" aria-label="Viewer controls">
          <button id="pose-toggle" class="icon-tool labeled-tool" type="button" title="Stand ring up" aria-pressed="true"><img src="./assets/icons/rotate-3d.svg" alt=""><span id="pose-label">Stand</span></button>
          <button id="center-view" class="icon-tool" type="button" title="Center view" aria-label="Center view"><img src="./assets/icons/focus.svg" alt=""></button>
          <button id="env-toggle" class="icon-tool labeled-tool" type="button" title="Lighting (HDRI)" aria-expanded="false" aria-controls="env-panel" style="width:auto;padding:0 8px"><span>HDRI</span>&nbsp;<span id="env-current" class="env-current"></span></button>
          <div class="quality-control"><div id="quality" class="quality-buttons" role="group" aria-label="Render quality">
            <button type="button" data-quality="1" aria-pressed="false">Med</button><button type="button" data-quality="1.5" aria-pressed="false">High</button><button type="button" data-quality="2" aria-pressed="false">Ultra</button>
          </div></div>
        </div>
      </div>
    </main>
    <aside class="panel" aria-label="Customize Noya">
      <header><h1>Noya</h1></header>
      <fieldset><legend>Diamond shape <span id="shape-label">Oval</span></legend><div id="shapes" class="shape-grid"></div></fieldset>
      <fieldset><legend>Center stone <span id="carat-label">3 ct</span></legend><div id="carats" class="segments"></div></fieldset>
      <div class="metal-fields" style="grid-template-columns:1fr">
        <fieldset><legend>Gold</legend><div id="ring-gold" class="gold-options" style="max-width:220px"></div></fieldset>
      </div>
      <section id="env-panel" class="env-panel" hidden aria-label="Lighting and tone mapping">
        <div class="env-head"><span>Lighting &amp; tone</span><button type="button" id="env-close" class="env-close" aria-label="Close lighting panel">&times;</button></div>
        <div class="env-row" data-kind="metal"><span class="env-kind">Metal</span><button type="button" class="env-step" data-dir="-1" aria-label="Previous metal HDRI">&#8249;</button><select aria-label="Metal HDRI"></select><button type="button" class="env-step" data-dir="1" aria-label="Next metal HDRI">&#8250;</button></div>
        <div class="env-row" data-kind="diamond"><span class="env-kind">Diamond</span><button type="button" class="env-step" data-dir="-1" aria-label="Previous diamond HDRI">&#8249;</button><select aria-label="Diamond HDRI"></select><button type="button" class="env-step" data-dir="1" aria-label="Next diamond HDRI">&#8250;</button></div>
        <div class="env-status" id="env-status" aria-live="polite"></div>
        <div class="env-row look-row"><span class="env-kind">Tone</span><select id="tm-select" aria-label="Tone mapping">
          <option value="neutral">Neutral (Khronos PBR)</option><option value="aces">ACES Filmic</option><option value="agx">AgX</option><option value="reinhard">Reinhard</option><option value="linear">Linear (clip)</option><option value="linburn">Linear + Burn (FStorm-style)</option></select></div>
        <label class="look-slider"><span class="env-kind">Exposure</span><input id="exposure" type="range" min="0.4" max="2.5" step="0.05"><output id="exposure-val"></output></label>
        <label class="look-slider"><span class="env-kind">Bloom</span><input id="bloom" type="range" min="0" max="0.6" step="0.01"><output id="bloom-val"></output></label>
        <label class="look-slider"><span class="env-kind">Floor</span><input id="floor" type="range" min="0" max="1.5" step="0.05"><output id="floor-val"></output></label>
        <button type="button" id="look-reset" class="look-reset">Reset look</button>
        <details id="advanced" class="advanced"><summary>Advanced colour</summary>
          <label class="look-slider"><span class="env-kind">Gamma</span><input id="g-gamma" type="range" min="0.6" max="1.8" step="0.01"><output id="g-gamma-val"></output></label>
          <label class="look-slider"><span class="env-kind">Contrast</span><input id="g-contrast" type="range" min="0.6" max="1.6" step="0.01"><output id="g-contrast-val"></output></label>
          <label class="look-slider"><span class="env-kind">Saturation</span><input id="g-saturation" type="range" min="0" max="2" step="0.01"><output id="g-saturation-val"></output></label>
          <label class="look-slider"><span class="env-kind">Vibrance</span><input id="g-vibrance" type="range" min="-1" max="1" step="0.01"><output id="g-vibrance-val"></output></label>
          <label class="look-slider"><span class="env-kind">Burn</span><input id="g-burn" type="range" min="0" max="1" step="0.01"><output id="g-burn-val"></output></label>
          <label class="look-slider"><span class="env-kind">Temp</span><input id="g-temperature" type="range" min="-1" max="1" step="0.01"><output id="g-temperature-val"></output></label>
          <label class="look-slider"><span class="env-kind">Tint</span><input id="g-tint" type="range" min="-1" max="1" step="0.01"><output id="g-tint-val"></output></label>
          <label class="look-slider"><span class="env-kind">Highlights</span><input id="g-highlights" type="range" min="-1" max="1" step="0.01"><output id="g-highlights-val"></output></label>
          <label class="look-slider"><span class="env-kind">Shadows</span><input id="g-shadows" type="range" min="-1" max="1" step="0.01"><output id="g-shadows-val"></output></label>
          <button type="button" id="grade-reset" class="look-reset">Reset advanced</button>
        </details>
      </section>
      <p id="error" class="error" role="alert" hidden></p>
      <div id="tuning"></div>
    </aside>
  </div>
  <script type="module" src="./app.js?v=sh8"></script>
</body>
</html>
