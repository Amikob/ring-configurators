<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>ND mark test – Ada 1ct Round</title>
<style>
html,body{margin:0;height:100%;background:#f4f2ee;font-family:-apple-system,system-ui,sans-serif;color:#222;overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
#ui{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:rgba(255,255,255,.92);text-align:center}
#ui p{margin:0 0 10px;font-size:14px;line-height:1.35}
button{font-size:15px;padding:10px 14px;margin:0 4px;border-radius:10px;border:1px solid #b08a3e;background:#fff;color:#7a5b1d}
button.on{background:#b08a3e;color:#fff}
#status{position:fixed;top:12px;left:0;right:0;text-align:center;font-size:13px;color:#666}
</style></head><body>
<canvas id="c"></canvas>
<div id="status">Loading…</div>
<div id="ui">
<p>Test only: Ada 1ct Round with the hidden “ND” mark (0.5 mm, engraved inside the head, finger side).</p>
<button id="nd">Show ND mark</button><button id="stone" class="on">Hide stone</button><button id="reset">Reset view</button>
</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {DRACOLoader} from 'three/addons/loaders/DRACOLoader.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.toneMapping=THREE.ACESFilmicToneMapping;
const scene=new THREE.Scene();scene.background=new THREE.Color(0xf4f2ee);
scene.environment=new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(),0.02).texture;
const camera=new THREE.PerspectiveCamera(35,1,0.05,500);
const controls=new OrbitControls(camera,canvas);controls.enableDamping=true;controls.minDistance=0.6;controls.maxDistance=120;
const MARK=new THREE.Vector3(-0.05,12.55,-1.8);
const DEF={pos:new THREE.Vector3(0,24,62),target:new THREE.Vector3(0,3,0),fov:35};
const NDV={pos:new THREE.Vector3(-0.05,12.1,1.6),target:MARK,fov:60};
let stone=null;
function view(v){camera.fov=v.fov;camera.updateProjectionMatrix();camera.position.copy(v.pos);controls.target.copy(v.target);controls.update();}
function setStone(show){if(stone)stone.visible=show;document.getElementById('stone').textContent=show?'Hide stone':'Show stone';document.getElementById('stone').classList.toggle('on',show);}
const draco=new DRACOLoader().setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
new GLTFLoader().setDRACOLoader(draco).load('ada-1ct-round-nd.glb',g=>{
  g.scene.traverse(o=>{if(o.material)o.material.side=THREE.DoubleSide;});scene.add(g.scene);stone=g.scene.getObjectByName('center_stone');
  document.getElementById('status').textContent='';window.__loaded=true;
},undefined,e=>{document.getElementById('status').textContent='Failed to load model';window.__error=String(e);});
document.getElementById('nd').onclick=()=>{view(NDV);setStone(false);window.__view='nd';};
document.getElementById('reset').onclick=()=>{view(DEF);setStone(true);window.__view='default';};
document.getElementById('stone').onclick=()=>setStone(!(stone&&stone.visible));
view(DEF);
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();
renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera);});
</script></body></html>
