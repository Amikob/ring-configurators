<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Erica (self-hosted pilot) | Next Diamonds</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./style.css?v=sh6">
  <link rel="stylesheet" href="./studio.css?v=sh11">
  <style>
    #viewer canvas { display:block; touch-action:none; }
    .pilot-badge { position:absolute; left:28px; top:44px; font-size:11px; color:#7b7b7b; z-index:2; }
    /* Docked in the side panel (desktop) / in place of the options (phone), so it never covers the ring. */
    .env-panel { background:#fff; border:1px solid #d9dedb; border-radius:10px; padding:10px; display:flex; flex-direction:column; gap:7px; }
    .env-head { display:flex; justify-content:space-between; align-items:center; font-size:13px; font-weight:600; }
    .env-close { width:30px; height:30px; border:1px solid #c9d1cd; border-radius:6px; background:#f4f6f5; font-size:18px; line-height:1; cursor:pointer; }
    .env-panel[hidden] { display:none; }
    .env-row { display:flex; align-items:center; gap:6px; }
    .env-kind { width:60px; font-size:13px; font-weight:600; }
    .env-row select { flex:1; min-width:0; height:36px; font-size:14px; border:1px solid #c9d1cd; border-radius:6px; background:#fff; padding:0 6px; }
    .env-step { width:36px; height:36px; border:1px solid #c9d1cd; border-radius:6px; background:#f4f6f5; font-size:20px; line-height:1; cursor:pointer; }
    .env-row select:disabled + .env-step, .env-step:disabled { opacity:.4; }
    .look-slider { display:flex; align-items:center; gap:6px; font-size:13px; }
    .look-slider input { flex:1; min-width:0; }
    .look-slider output { width:38px; text-align:right; font-size:12px; color:#555; font-variant-numeric:tabular-nums; }
    .advanced summary { cursor:pointer; font-size:13px; font-weight:600; padding:4px 0; }
    .advanced[open] { display:flex; flex-direction:column; gap:5px; }
    .look-reset { align-self:flex-end; font-size:12px; border:1px solid #c9d1cd; border-radius:6px; background:#f4f6f5; padding:4px 10px; cursor:pointer; }
    .env-status { font-size:11px; color:#7b7b7b; min-height:14px; }
    .env-current { font-size:12px; color:#244c3e; font-weight:600; }
    @media (max-width: 850px) {
      .panel.look-open > fieldset, .panel.look-open > .metal-fields { display:none; }
      .env-panel { padding:8px; gap:5px; border-radius:8px; max-height:46dvh; overflow-y:auto; }
      .env-row select, .env-step { height:32px; } .env-step { width:32px; }
      .env-head .env-close { width:28px; height:28px; }
    }
    @media (max-width: 1000px) and (orientation: landscape) and (max-height: 550px) { .panel.look-open > fieldset, .panel.look-open > .metal-fields { display:none; } }
    #tuning { display:none; gap:6px; flex-direction:column; font-size:12px; padding-top:14px; border-top:1px solid var(--line); }
    #tuning.on { display:flex; } #tuning label { display:flex; justify-content:space-between; gap:8px; align-items:center; } #tuning input[type=range]{ width:55%; }
  </style>
  <script type="importmap">
  { "imports": {
      "three": "./vendor/three/three.module.js",
      "three/addons/": "./vendor/three/addons/",
      "three-mesh-bvh": "./vendor/three-mesh-bvh.module.js"
  } }
  </script>
</head>
<body>
  <div class="app">
    <main class="stage" aria-label="Erica 3D ring set">
      <div class="stage-brand"><img src="./assets/wordmark-1row-black.png" alt="Next Diamonds" width="1800" height="220"><span>Erica</span></div>
      <div id="viewer" aria-label="Interactive 3D viewer"></div>
      <div id="startup" class="startup" role="status"><img class="loading-monogram" src="./assets/monogram-champagne.png" alt="Next Diamonds" width="960" height="960"><span class="spinner"></span><span id="startup-text">Opening Erica...</span></div>
      <div class="pilot-badge">Self-hosted pilot (own engine, own storage)</div>
      <div class="viewer-footer">
        <div class="stage-caption"><span id="selection-summary">Erica</span><span id="update-status" role="status" aria-live="polite"></span></div>
        <div class="viewer-tools" role="group" aria-label="Viewer controls">
          <button id="pose-toggle" class="icon-tool labeled-tool" type="button" title="Rest ring on the floor" aria-pressed="false"><img src="./assets/icons/rotate-3d.svg" alt=""><span id="pose-label">Rest</span></button>
          <button id="center-view" class="icon-tool" type="button" title="Center view" aria-label="Center view"><img src="./assets/icons/focus.svg" alt=""></button>
          <button id="env-toggle" class="icon-tool labeled-tool" type="button" title="Studio settings (HDRI, tone, bloom, materials, presets)" aria-expanded="false" aria-controls="studio" style="width:auto;padding:0 10px"><span>Studio</span></button>
          <div class="quality-control"><div id="quality" class="quality-buttons" role="group" aria-label="Render quality">
            <button type="button" data-quality="1" aria-pressed="false">Med</button><button type="button" data-quality="1.5" aria-pressed="false">High</button><button type="button" data-quality="2" aria-pressed="false">Ultra</button>
          </div></div>
        </div>
      </div>
    </main>
    <aside class="panel" aria-label="Customize Erica">
      <div class="panel-tabs" role="tablist"><button type="button" role="tab" id="tab-ring" aria-selected="true">Ring</button><button type="button" role="tab" id="tab-studio" aria-selected="false">Studio</button></div>
      <header><h1>Erica</h1></header>
      <fieldset><legend>Diamond shape <span id="shape-label">Oval</span></legend><div id="shapes" class="shape-grid"></div></fieldset>
      <fieldset><legend>Center stone <span id="carat-label">3 ct</span></legend><div id="carats" class="segments"></div></fieldset>
      <fieldset><legend>Matching band</legend><div id="bands" class="segments"></div></fieldset>
      <div class="metal-fields">
        <fieldset><legend>Ring gold</legend><div id="ring-gold" class="gold-options"></div></fieldset>
        <fieldset id="band-gold-field" hidden><legend>Band gold</legend><div id="band-gold" class="gold-options"></div></fieldset>
      </div>
      <section id="studio" class="studio" hidden aria-label="Studio settings"></section>
      <p id="error" class="error" role="alert" hidden></p>
    </aside>
  </div>
  <script type="module" src="./app.js?v=sh11"></script>
</body>
</html>
